name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test and build signed APKs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - run: chmod +x gradlew

      # The signing key is stored encrypted in .github/signing; SIGNING_PASSPHRASE
      # (a repository secret) unlocks it. Without the secret (e.g. pull requests
      # from forks) the APKs are built unsigned.
      - name: Unlock signing key
        if: env.SIGNING_PASSPHRASE != ''
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          echo "$SIGNING_PASSPHRASE" | gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 0 \
            -d .github/signing/signing.tgz.gpg | tar -xzf -
          test -f keystore.properties && test -f minimalos-release.jks

      - name: Unit tests
        run: ./gradlew :app:testReleaseUnitTest --stacktrace

      - name: Build public APK (no prayer times)
        run: |
          ./gradlew :app:assembleRelease -PprayerTimes=false --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/app-release*.apk "out/MinimalOS-${GITHUB_REF_NAME//\//-}.apk"

      - name: Build personal APK (with prayer times)
        run: |
          ./gradlew :app:assembleRelease -PprayerTimes=true --stacktrace
          cp app/build/outputs/apk/release/app-release*.apk "out/MinimalOS-${GITHUB_REF_NAME//\//-}-prayer.apk"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: MinimalOS-APKs
          path: out/*.apk
          retention-days: 30

      # Tagging a version (e.g. v2.1.0) publishes the public APK as a GitHub Release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/MinimalOS-${{ github.ref_name }}.apk
          generate_release_notes: true
