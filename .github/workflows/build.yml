name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test and build signed APKs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - run: chmod +x gradlew

      # The signing key is stored encrypted in .github/signing; SIGNING_PASSPHRASE
      # (a repository secret) unlocks it. Without the secret (e.g. pull requests
      # from forks) the APKs are built unsigned.
      - name: Unlock signing key
        if: env.SIGNING_PASSPHRASE != ''
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
        run: |
          echo "$SIGNING_PASSPHRASE" | gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 0 \
            -d .github/signing/signing.tgz.gpg | tar -xzf -
          test -f keystore.properties && test -f minimalos-release.jks

      # e.g. MinimalOS-v2.1.0 for a tag, MinimalOS-main for main, MinimalOS-32-merge for a PR
      - name: Name the APKs
        run: echo "APK_NAME=MinimalOS-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testReleaseUnitTest --stacktrace

      - name: Build public APK (no prayer times)
        run: |
          ./gradlew :app:assembleRelease -PprayerTimes=false --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/app-release*.apk "out/$APK_NAME.apk"

      - name: Build personal APK (with prayer times)
        run: |
          ./gradlew :app:assembleRelease -PprayerTimes=true --stacktrace
          cp app/build/outputs/apk/release/app-release*.apk "out/$APK_NAME-prayer.apk"

      # Each APK is its own download (not zipped), named after the file.
      - name: Upload public APK
        uses: actions/upload-artifact@v7
        with:
          path: out/${{ env.APK_NAME }}.apk
          archive: false
          retention-days: 30

      - name: Upload personal APK
        uses: actions/upload-artifact@v7
        with:
          path: out/${{ env.APK_NAME }}-prayer.apk
          archive: false
          retention-days: 30

      # Tagging a version (e.g. v2.1.0) publishes the public APK as a GitHub Release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: out/${{ env.APK_NAME }}.apk
          generate_release_notes: true
